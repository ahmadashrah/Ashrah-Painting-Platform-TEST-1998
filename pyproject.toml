[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lumia"
version = "0.1.0"
description = "Lumia — B2B marketing and growth agent for Ashrah Painting Ltd."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.69.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
lumia = "lumia.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
