name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        # The suite uses a scripted fake client — no API key, no network.
        run: python -m pytest -q

      - name: Smoke-test the CLI
        env:
          PYTHONPATH: src
          ASHRAH_DATA_DIR: ${{ runner.temp }}/lumia-ci
        run: |
          python -m lumia.cli status
          python -m lumia.cli seed
          python -m lumia.cli pipeline
          python -m lumia.cli weekly --metrics-only
          python -m lumia.cli roster
          python -m lumia.cli roster --date 2026-08-17
          python -m lumia.cli schedule --plan-only
          python -m lumia.cli monitor --report-only
